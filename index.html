<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#3f9b4b">
  <title>나의 클래스크 · 오이쉬반</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥒</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #f3f6ef;
      --card: #ffffff;
      --ink: #1f2a1f;
      --sub: #6b756b;
      --faint: #a3ab9f;
      --line: #e3e8dc;
      --brand: #3f9b4b;
      --brand-dark: #2e7a39;
      --brand-soft: #e5f3e3;
      --up: #2e8b3e;
      --down: #d9534f;
      --late: #e0703a;
      --radius: 22px;
      --shadow: 0 3px 12px rgba(40, 60, 30, .07);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; }
    body {
      font-family: Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; color: inherit; border: none; background: none; cursor: pointer; text-align: left; }

    .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
    .screen { display: none; }
    .screen.active { display: block; }

    /* ---------- 상단 바 ---------- */
    .top { display: flex; align-items: center; gap: 10px; padding: 6px 0 16px; }
    .logo {
      width: 44px; height: 44px; border-radius: 14px; background: var(--brand);
      display: grid; place-items: center; font-size: 24px; flex-shrink: 0;
    }
    .top .who { flex: 1; min-width: 0; }
    .top .who h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 21px; font-weight: 800; letter-spacing: -0.4px; }
    .top .who p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; color: var(--sub); font-weight: 600; }
    .icon-btn {
      width: 42px; height: 42px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow);
      display: grid; place-items: center; font-size: 18px; flex-shrink: 0;
    }
    .icon-btn.text { width: auto; padding: 0 14px; font-size: 14px; font-weight: 700; color: var(--sub); }

    /* ---------- 로그인 ---------- */
    .login-hero { text-align: center; padding: 28px 0 22px; }
    .login-hero .logo { width: 72px; height: 72px; border-radius: 22px; font-size: 40px; margin: 0 auto 14px; }
    .login-hero h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.6px; }
    .login-hero p { font-size: 16px; color: var(--sub); font-weight: 600; margin-top: 6px; }
    .names { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .name-btn {
      background: var(--card); border-radius: 16px; box-shadow: var(--shadow); height: 64px;
      display: flex; align-items: center; gap: 10px; padding: 0 12px;
    }
    .name-btn:active { transform: scale(.96); }
    .name-btn .n {
      width: 30px; height: 30px; border-radius: 50%; background: var(--brand-soft); color: var(--brand);
      display: grid; place-items: center; font-size: 14px; font-weight: 800; flex-shrink: 0;
    }
    .name-btn .nm { font-size: 19px; font-weight: 800; white-space: nowrap; }

    /* ---------- 자산 카드 ---------- */
    .asset {
      width: 100%; display: block; border-radius: 26px; padding: 22px 22px 18px; color: #fff;
      background: linear-gradient(135deg, #3f9b4b 0%, #2e7a39 100%);
      box-shadow: 0 10px 24px rgba(46, 122, 57, .28); margin-bottom: 22px;
    }
    .asset:active { transform: scale(.985); }
    .asset .label { font-size: 15px; font-weight: 700; opacity: .85; }
    .asset .amount { display: flex; align-items: baseline; gap: 8px; margin: 6px 0 14px; }
    .asset .amount b { font-size: 48px; font-weight: 800; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
    .asset .amount span { font-size: 22px; font-weight: 700; }
    .asset .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .asset .chip {
      background: rgba(255,255,255,.18); border-radius: 999px; padding: 6px 12px;
      font-size: 14px; font-weight: 700;
    }
    .asset .more { margin-top: 14px; font-size: 14px; font-weight: 700; opacity: .9; }

    .sec-title { display: flex; align-items: baseline; justify-content: space-between; margin: 0 2px 12px; }
    .sec-title h2 { font-size: 19px; font-weight: 800; }
    .sec-title span { font-size: 13px; color: var(--sub); font-weight: 600; }

    /* ---------- 활동 카드 ---------- */
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card {
      background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 16px 16px 14px; display: flex; flex-direction: column; min-width: 0;
    }
    .card:active { transform: scale(.97); }
    .c-head { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .c-icon {
      width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font-size: 19px;
      background: color-mix(in srgb, var(--c) 14%, white); flex-shrink: 0;
    }
    .c-title { font-size: 16px; font-weight: 800; white-space: nowrap; flex-shrink: 0; }
    .c-today {
      font-size: 11px; font-weight: 800; padding: 3px 7px; border-radius: 999px; margin-left: auto; white-space: nowrap;
      background: color-mix(in srgb, var(--c) 14%, white); color: var(--c);
    }
    .c-today.late { background: #fdeee5; color: var(--late); }
    .c-big { display: flex; align-items: baseline; gap: 3px; margin: 12px 0 2px; }
    .c-big b { font-size: 32px; font-weight: 800; letter-spacing: -0.8px; font-variant-numeric: tabular-nums; }
    .c-big small { font-size: 15px; font-weight: 700; color: var(--sub); }
    .c-big .pre { font-size: 13px; font-weight: 700; color: var(--sub); margin-right: 3px; }
    .c-sub { font-size: 13px; color: var(--sub); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 18px; }

    .week { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
    .wd { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .wd i {
      width: 18px; height: 18px; border-radius: 50%; background: #edf0e9; display: block;
    }
    .wd span { font-size: 11px; color: var(--faint); font-weight: 700; }
    .wd.on i { background: var(--c); }
    .wd.late i { background: var(--late); }
    .wd.part i { background: color-mix(in srgb, var(--c) 35%, white); }
    .wd.today span { color: var(--ink); }
    .wd.today i { box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--ink); }

    /* 지난 주와 비교 */
    .cmp-msg { font-size: 15px; font-weight: 700; color: var(--ink); background: var(--brand-soft); border-radius: 14px; padding: 12px 14px; margin-bottom: 6px; }
    .cmp-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .cmp-row:last-child { border-bottom: none; }
    .cmp-row.click { cursor: pointer; }
    .cmp-label { width: 64px; white-space: nowrap; flex-shrink: 0; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
    .cmp-bars { flex: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .cmp-bar { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--sub); }
    .cmp-bar span { width: 40px; flex-shrink: 0; white-space: nowrap; }
    .cmp-bar .track { flex: 1; height: 10px; background: #f0f2ec; border-radius: 99px; overflow: hidden; }
    .cmp-bar .track i { display: block; height: 100%; border-radius: 99px; min-width: 2px; }
    .cmp-bar.last .track i { background: #c9cfc3; }
    .cmp-bar.this .track i { background: var(--c); }
    .cmp-bar b { width: 24px; text-align: right; flex-shrink: 0; color: var(--ink); font-size: 13px; }
    .diff { width: 56px; white-space: nowrap; flex-shrink: 0; text-align: center; font-size: 13px; font-weight: 800; padding: 5px 0; border-radius: 999px; background: #f0f2ec; color: var(--sub); }
    .diff.good { background: #e3f3e2; color: var(--up); }
    .diff.bad { background: #fbe9e8; color: var(--down); }
    .cmp-note { font-size: 12px; color: var(--faint); font-weight: 600; margin-top: 8px; }

    .wk-compare { display: grid; grid-template-columns: 54px repeat(5, 1fr) 46px; align-items: center; row-gap: 10px; }
    .wk-compare .lbl { white-space: nowrap; font-size: 13px; font-weight: 800; color: var(--sub); }
    .wk-compare .cnt { font-size: 15px; font-weight: 800; text-align: right; }
    .wk-compare .wd { justify-self: center; }

    /* 비밀번호 바꾸기 안내 */
    .pin-nudge {
      width: 100%; display: flex; align-items: center; gap: 12px; background: #fff6dd; border-radius: 18px;
      padding: 14px 16px; margin-bottom: 16px; font-size: 15px; font-weight: 700; color: #8a6200;
    }
    .pin-nudge b { margin-left: auto; white-space: nowrap; background: #f0a20f; color: #fff; padding: 7px 12px; border-radius: 999px; font-size: 14px; }

    .updated { text-align: center; font-size: 13px; color: var(--faint); font-weight: 600; margin-top: 22px; }

    /* ---------- 상세 화면 ---------- */
    .d-title { flex: 1; font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .stat { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 12px; }
    .stat span { font-size: 13px; color: var(--sub); font-weight: 700; }
    .stat b { display: block; font-size: 22px; font-weight: 800; margin-top: 4px; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
    .stat b small { font-size: 13px; color: var(--sub); font-weight: 700; margin-left: 2px; }
    .stat b.up { color: var(--up); }
    .stat b.down { color: var(--down); }

    .panel { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }

    /* 달력 */
    .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .cal-head b { font-size: 17px; font-weight: 800; }
    .cal-nav { width: 36px; height: 36px; border-radius: 12px; background: var(--bg); font-size: 18px; font-weight: 800; display: grid; place-items: center; }
    .cal-nav:disabled { opacity: .3; }
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal .dow { text-align: center; font-size: 12px; font-weight: 700; color: var(--sub); padding-bottom: 4px; }
    .cal .dow.sun { color: #d06a6a; }
    .cal .dow.sat { color: #5b86c4; }
    .cal .day {
      aspect-ratio: 1; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: var(--ink); position: relative;
    }
    .cal .day.weekend { color: var(--faint); }
    .cal .day.on { background: var(--c); color: #fff; }
    .cal .day.late { background: var(--late); color: #fff; }
    .cal .day.part { background: color-mix(in srgb, var(--c) 22%, white); }
    .cal .day.today { box-shadow: inset 0 0 0 2px var(--ink); }
    .cal .day em { font-style: normal; font-size: 10px; font-weight: 800; line-height: 1; margin-top: 1px; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; color: var(--sub); font-weight: 600; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }

    /* 목록 */
    .list-title { font-size: 16px; font-weight: 800; margin: 4px 2px 10px; }
    .list { display: flex; flex-direction: column; }
    .row { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: none; }
    .r-date { width: 44px; text-align: center; flex-shrink: 0; }
    .r-date b { display: block; font-size: 19px; font-weight: 800; line-height: 1.1; }
    .r-date span { font-size: 12px; color: var(--sub); font-weight: 700; }
    .r-icon { width: 38px; height: 38px; border-radius: 12px; background: var(--bg); display: grid; place-items: center; font-size: 19px; flex-shrink: 0; }
    .r-main { flex: 1; min-width: 0; }
    .r-title { font-size: 16px; font-weight: 700; word-break: break-all; }
    .r-sub { font-size: 13px; color: var(--sub); font-weight: 600; margin-top: 2px; }
    .r-right { font-size: 16px; font-weight: 800; flex-shrink: 0; }
    .r-right.up { color: var(--up); }
    .r-right.down { color: var(--down); }
    .badge { font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); }
    .badge.late { background: #fdeee5; color: var(--late); }
    .bar { height: 8px; border-radius: 99px; background: #f0eee9; margin-top: 6px; overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: 99px; background: var(--late); }

    .group-head { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 2px 4px; }
    .group-head b { font-size: 14px; font-weight: 800; color: var(--sub); }
    .group-head span { font-size: 14px; font-weight: 800; color: var(--up); }

    .filters { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filter { white-space: nowrap; padding: 8px 14px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); font-size: 14px; font-weight: 700; color: var(--sub); }
    .filter.on { background: var(--ink); color: #fff; }

    .empty { text-align: center; color: var(--sub); font-size: 15px; font-weight: 600; padding: 26px 0; }

    /* ---------- 비밀번호 ---------- */
    .overlay { position: fixed; inset: 0; background: rgba(20, 30, 20, .5); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
    .overlay.show { display: flex; }
    .sheet {
      background: var(--card); width: 100%; max-width: 420px; border-radius: 28px 28px 0 0;
      padding: 26px 22px calc(22px + env(safe-area-inset-bottom));
    }
    @media (min-width: 600px) { .overlay { align-items: center; } .sheet { border-radius: 28px; } }
    .sheet h2 { text-align: center; font-size: 22px; font-weight: 800; }
    .sheet .hint { text-align: center; font-size: 15px; color: var(--sub); font-weight: 600; margin-top: 6px; min-height: 22px; }
    .sheet .hint.err { color: var(--down); }
    .dots { display: flex; justify-content: center; gap: 16px; margin: 20px 0 22px; }
    .dots i { width: 18px; height: 18px; border-radius: 50%; background: #e6eae1; }
    .dots i.fill { background: var(--brand); }
    .dots.shake { animation: shake .4s; }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
    .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .key { height: 62px; border-radius: 18px; background: var(--bg); font-size: 26px; font-weight: 700; text-align: center; }
    .key:active { background: #e3e9dc; }
    .key.fn { font-size: 16px; color: var(--sub); }
    .sheet .cancel { display: block; width: 100%; text-align: center; margin-top: 14px; font-size: 16px; font-weight: 700; color: var(--sub); padding: 8px; }


    /* ---------- 하단 탭 ---------- */
    .nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; display: none;
      background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-top: 1px solid var(--line);
      padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
    }
    .nav .in { max-width: 560px; margin: 0 auto; display: flex; }
    .nav button { flex: 1; text-align: center; padding: 6px 0; font-size: 12px; font-weight: 800; color: var(--faint); position: relative; }
    .nav button i { display: block; font-style: normal; font-size: 22px; line-height: 1.2; filter: grayscale(1); opacity: .6; }
    .nav button.on { color: var(--ink); }
    .nav button.on i { filter: none; opacity: 1; }
    .nav .dot { position: absolute; top: 2px; left: calc(50% + 10px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--down); color: #fff; font-size: 11px; line-height: 18px; }
    body.has-nav .wrap { padding-bottom: 96px; }

    /* ---------- 과제 ---------- */
    .hw-banner {
      width: 100%; display: flex; align-items: center; gap: 12px; background: var(--card); box-shadow: var(--shadow);
      border-radius: 20px; padding: 16px 18px; margin: -8px 0 22px;
    }
    .hw-banner .ic { width: 42px; height: 42px; border-radius: 14px; background: #eef1fb; display: grid; place-items: center; font-size: 22px; flex-shrink: 0; }
    .hw-banner .tx { flex: 1; min-width: 0; }
    .hw-banner .tx b { display: block; font-size: 17px; font-weight: 800; }
    .hw-banner .tx span { font-size: 13px; color: var(--sub); font-weight: 600; }
    .hw-banner .go { font-size: 14px; font-weight: 800; color: #3b5bdb; white-space: nowrap; }
    .hw-banner.todo .ic { background: #fff1e6; }
    .hw-banner.todo .go { color: var(--late); }

    .hw-group { font-size: 15px; font-weight: 800; color: var(--sub); margin: 18px 2px 10px; }
    .hw-group:first-child { margin-top: 0; }
    .hw-card { width: 100%; display: block; background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 10px; }
    .hw-card:active { transform: scale(.985); }
    .hw-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .tag { font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 999px; background: var(--bg); color: var(--sub); white-space: nowrap; }
    .tag.subj { background: #eef1fb; color: #3b5bdb; }
    .tag.due { margin-left: auto; background: #fff1e6; color: var(--late); }
    .tag.due.soon { background: var(--late); color: #fff; }
    .tag.due.none { background: var(--bg); color: var(--faint); }
    .hw-title { font-size: 18px; font-weight: 800; margin: 10px 0 4px; }
    .hw-meta { font-size: 13px; color: var(--sub); font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .st { font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
    .st.none { background: #f0f2ec; color: var(--sub); }
    .st.done { background: var(--brand-soft); color: var(--brand); }
    .st.late { background: #fdeee5; color: var(--late); }
    .st.ok { background: #e7efff; color: #3b5bdb; }
    .st.redo { background: #fbe9e8; color: var(--down); }

    .hw-info h2 { font-size: 21px; font-weight: 800; margin: 10px 0 8px; letter-spacing: -0.4px; }
    .hw-desc { font-size: 16px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
    .hw-std { margin-top: 12px; background: var(--bg); border-radius: 14px; padding: 10px 12px; font-size: 13px; color: var(--sub); font-weight: 600; line-height: 1.5; }
    .hw-std b { color: var(--ink); }
    .hw-facts { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 14px; font-weight: 600; color: var(--sub); }
    .fb { background: #e7efff; border-radius: 18px; padding: 14px 16px; margin-bottom: 16px; }
    .fb b { display: block; font-size: 14px; color: #3b5bdb; margin-bottom: 4px; }
    .fb p { font-size: 16px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
    .notice { border-radius: 14px; padding: 10px 12px; font-size: 14px; font-weight: 700; margin-bottom: 12px; background: #fff1e6; color: var(--late); }
    .notice.red { background: #fbe9e8; color: var(--down); }

    .field-label { font-size: 15px; font-weight: 800; margin: 4px 0 8px; display: flex; justify-content: space-between; }
    .field-label span { font-size: 13px; color: var(--faint); font-weight: 700; }
    .hw-text {
      width: 100%; min-height: 180px; resize: vertical; border-radius: 16px; border: 2px solid var(--line); background: #fff;
      padding: 14px; font-family: inherit; font-size: 17px; line-height: 1.6; color: var(--ink); outline: none;
    }
    .hw-text:focus { border-color: var(--brand); }
    .imgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .img-tile { position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: var(--bg); }
    .img-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .img-tile .x { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font-size: 15px; text-align: center; }
    .img-add { aspect-ratio: 1; border-radius: 14px; border: 2px dashed #cfd6c8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 800; color: var(--sub); text-align: center; }
    .img-add i { font-style: normal; font-size: 28px; }
    .btn-row { display: flex; gap: 10px; margin-top: 16px; }

<script>
  /* =================================================================
     서버 연결 설정 (GitHub Pages → Apps Script)
     Apps Script에서 '배포 → 웹 앱'으로 배포한 뒤 나오는 URL(…/exec)을 아래에 붙여 넣어요.
     ================================================================= */
  const API_URL = 'https://script.google.com/macros/s/AKfycbwKP-H4y9Q7UaFQ--srquXkx_2UVxOEvEoaunxuLuARzWlNo53uAFgNa5ksQW9B1Mo2/exec';

  /* google.script.run 과 똑같이 쓸 수 있게 만든 연결 도우미 (fetch로 Apps Script의 doPost를 불러요) */
  (function () {
    if (window.google && window.google.script && window.google.script.run) return;   // Apps Script 안에서 열면 원래 방식 그대로
    function runner(ok, fail) {
      return new Proxy({}, {
        get(_, name) {
          if (name === 'withSuccessHandler') return f => runner(f, fail);
          if (name === 'withFailureHandler') return f => runner(ok, f);
          if (name === 'withUserObject') return () => runner(ok, fail);
          if (typeof name !== 'string') return undefined;
          return (...args) => {
            callApi(name, args).then(
              data => { if (ok) ok(data); },
              err => { if (fail) fail(err); else console.error(err); }
            );
          };
        }
      });
    }
    window.google = window.google || {};
    window.google.script = { run: runner(null, null) };
  })();

  async function callApi(fn, args) {
    if (API_URL.indexOf('여기에') >= 0) throw new Error('index.html 맨 위 API_URL에 웹 앱 주소를 넣어 주세요.');
    let res;
    try {
      res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // 사전 확인(CORS) 없이 보내는 방식
        body: JSON.stringify({ fn: fn, args: args || [] }),
        redirect: 'follow'
      });
    } catch (e) {
      throw new Error('서버와 연결하지 못했어요. 인터넷을 확인하고 다시 해 볼까요?');
    }
    if (!res.ok) throw new Error('서버 오류가 났어요. (' + res.status + ')');
    let json;
    try { json = await res.json(); }
    catch (e) { throw new Error('서버 답을 읽지 못했어요. 웹 앱 액세스가 \'모든 사용자\'인지 확인해 주세요.'); }
    if (json && json.__error) throw new Error(json.__error);
    return json ? json.data : null;
  }

  /* ---------- 설정 ---------- */
  const ITEMS = {
    attendance: { title: '출석',   icon: '✅', color: '#3f9b4b' },
    milk:       { title: '우유',   icon: '🥛', color: '#4a8fd1' },
    brush:      { title: '양치',   icon: '🪥', color: '#22aa9a' },
    walk:       { title: '운동',   icon: '🚶', color: '#8a5cd1' },
    shine:      { title: '반짝',   icon: '✨', color: '#e09a00' },
    leftover:   { title: '잔반',   icon: '🍱', color: '#e0703a' }
  };
  const ECO_LABELS = { '반짝이는활동': '반짝' };   // 화면에 보이는 이름
  const ecoLabel = c => ECO_LABELS[c] || c || '기타';
  const ECO_ICONS = {
    '출석체크': '✅', '우유체크': '🥛', '양치체크': '🪥', '운동체크': '🚶',
    '반짝이는활동': '✨', '잔반 다 먹음': '🍱', '질문 탐구 정리': '🔍',
    '독서 기록': '📖', '책 다 읽음': '📚'
  };
  const STORE_KEY = 'classk_my_token';
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];

  let INFO = null;
  let DATA = null;
  let TOKEN = null;
  let current = null;        // 상세 화면 항목
  let calY = 0, calM = 0;    // 상세 달력 연·월
  let ecoFilter = '전체';
  let pinStudent = null;
  let pinValue = '';
  let pinBusy = false;
  let lastFetch = 0;
  let ECO_CATS = ['전체'];
  let pinMode = 'login';      // login | old | new | confirm
  let pinOld = '', pinNew = '';

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  /* ---------- 날짜 도우미 ---------- */
  const pad2 = n => String(n).padStart(2, '0');
  const toKey = dt => `${dt.getFullYear()}-${pad2(dt.getMonth() + 1)}-${pad2(dt.getDate())}`;
  const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const fmtDay = k => { const dt = fromKey(k); return `${dt.getMonth() + 1}월 ${dt.getDate()}일 (${DOW[dt.getDay()]})`; };
  const fmtShort = k => { const dt = fromKey(k); return `${dt.getMonth() + 1}월 ${dt.getDate()}일`; };

  /* offset: 0 = 이번 주, -1 = 지난 주 (월~금) */
  function weekKeys(todayKey, offset) {
    const t = fromKey(todayKey);
    const mon = new Date(t);
    mon.setDate(t.getDate() - ((t.getDay() + 6) % 7) + (offset || 0) * 7);
    return [0, 1, 2, 3, 4].map(i => { const d = new Date(mon); d.setDate(mon.getDate() + i); return toKey(d); });
  }

  /* ---------- 시작 ---------- */
  window.addEventListener('load', () => {
    buildPad();
    document.addEventListener('keydown', onKey);
    $('filePick').addEventListener('change', onFilesPicked);
    $('qInput').addEventListener('input', autoGrow);
    $('qInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.innerWidth > 700) { e.preventDefault(); sendQuestion(); }
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && TOKEN && !TEACHER && Date.now() - lastFetch > 60 * 1000) fetchDashboard(false);
    });

    showLoading(true);
    google.script.run
      .withSuccessHandler(info => {
        INFO = info;
        $('loginTitle').textContent = info.appName;
        $('loginSub').textContent = `${info.className} · 내 이름을 눌러요`;
        document.title = `${info.appName} · ${info.className}`;
        renderNames();
        TOKEN = store.get(STORE_KEY);
        if (TOKEN && store.get(ROLE_KEY) === 'T') enterTeacher();
        else if (TOKEN) fetchDashboard(true);
        else { showLoading(false); showScreen('loginScreen'); }
      })
      .withFailureHandler(err => { onError(err); showScreen('loginScreen'); })
      .getLoginInfo();
  });

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
    const nav = ['homeScreen', 'hwScreen', 'inqScreen', 'bookScreen'].includes(id);
    $('nav').style.display = nav ? 'block' : 'none';
    document.body.classList.toggle('has-nav', nav);
    $('tabHome').style.display = TEACHER ? 'none' : '';
    $('tabHome').classList.toggle('on', id === 'homeScreen');
    $('tabHw').classList.toggle('on', id === 'hwScreen');
    $('tabInq').classList.toggle('on', id === 'inqScreen');
    $('tabBook').classList.toggle('on', id === 'bookScreen');
    document.body.classList.toggle('book-open', id === 'bookDetailScreen');
    updateChatBar(id);
    window.scrollTo(0, 0);
  }

  /* ---------- 로그인 ---------- */
  function renderNames() {
    $('names').innerHTML = INFO.students.map(s => `
      <button class="name-btn" onclick="pickName(${s.num})">
        <span class="n">${s.num}</span><span class="nm">${esc(s.name)}</span>
      </button>`).join('');
  }

  function pickName(num) {
    const s = INFO.students.find(x => x.num === num);
    if (!s) return;
    if (!INFO.requirePin) { doLogin(s, ''); return; }
    pinStudent = s;
    pinMode = 'login';
    $('pinCancel').textContent = '다른 이름 고르기';
    showPinStep(`${s.name}, 반가워요!`, '비밀번호 4자리를 눌러요');
    $('pinOverlay').classList.add('show');
  }

  function buildPad() {
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', '⌫'];
    $('pad').innerHTML = keys.map(k => {
      const fn = k === 'C' || k === '⌫';
      const label = k === 'C' ? '전체 지움' : k;
      return `<button class="key ${fn ? 'fn' : ''}" onclick="pressKey('${k}')">${label}</button>`;
    }).join('');
  }

  function pressKey(k) {
    if (pinBusy) return;
    if (k === 'C') pinValue = '';
    else if (k === '⌫') pinValue = pinValue.slice(0, -1);
    else if (pinValue.length < 4) pinValue += k;
    drawDots();
    if (pinValue.length === 4) onPinDone(pinValue);
  }

  function onPinDone(v) {
    if (pinMode === 'login') { doLogin(pinStudent, v); return; }
    if (pinMode === 'teacher') { doTeacherLogin(v); return; }
    if (pinMode === 'old') {
      pinOld = v;
      pinMode = 'new';
      showPinStep('새 비밀번호', '새로 쓸 숫자 4자리를 눌러요');
      return;
    }
    if (pinMode === 'new') {
      if (v === '0000') { pinFail('0000은 쓸 수 없어요. 다른 번호로 정해요.'); return; }
      if (v === pinOld) { pinFail('지금 비밀번호와 같아요. 다른 번호로 정해요.'); return; }
      pinNew = v;
      pinMode = 'confirm';
      showPinStep('한 번 더 확인', '새 비밀번호를 한 번 더 눌러요');
      return;
    }
    if (pinMode === 'confirm') {
      if (v !== pinNew) {
        pinMode = 'new';
        pinNew = '';
        showPinStep('새 비밀번호', '');
        pinFail('두 번 누른 번호가 달라요. 새 비밀번호부터 다시 해요.');
        return;
      }
      saveNewPin();
    }
  }

  function showPinStep(title, hint) {
    pinValue = '';
    $('pinTitle').textContent = title;
    if (hint) setHint(hint, false);
    drawDots();
  }

  function pinFail(msg) {
    pinValue = '';
    drawDots();
    setHint(msg, true);
    $('dots').classList.remove('shake');
    void $('dots').offsetWidth;
    $('dots').classList.add('shake');
  }

  /* ---------- 비밀번호 바꾸기 ---------- */
  function openChangePin() {
    if (!INFO.requirePin) { toast('이 앱은 비밀번호를 쓰지 않아요.'); return; }
    pinMode = 'old';
    pinOld = pinNew = '';
    $('pinCancel').textContent = '취소';
    showPinStep('비밀번호 바꾸기', '지금 비밀번호 4자리를 눌러요');
    $('pinOverlay').classList.add('show');
  }

  function saveNewPin() {
    pinBusy = true;
    showLoading(true);
    google.script.run
      .withSuccessHandler(res => {
        pinBusy = false;
        showLoading(false);
        if (res.ok) {
          closePin();
          if (DATA) { DATA.mustChange = false; $('pinNudge').style.display = 'none'; }
          toast('🔑 비밀번호를 바꿨어요! 다음부터 새 번호로 들어와요.');
          return;
        }
        if (res.reason === 'auth') { closePin(); doLogout(); toast(res.message); return; }
        if (res.step === 'old') {
          pinMode = 'old';
          showPinStep('비밀번호 바꾸기', '');
        } else {
          pinMode = 'new';
          showPinStep('새 비밀번호', '');
        }
        pinFail(res.message);
      })
      .withFailureHandler(err => { pinBusy = false; onError(err); })
      .changePin(TOKEN, pinOld, pinNew);
  }

  function onKey(e) {
    if (!$('pinOverlay').classList.contains('show')) return;
    if (/^[0-9]$/.test(e.key)) pressKey(e.key);
    else if (e.key === 'Backspace') pressKey('⌫');
    else if (e.key === 'Escape') closePin();
  }

  function drawDots() {
    [...$('dots').children].forEach((d, i) => d.classList.toggle('fill', i < pinValue.length));
  }

  function setHint(msg, err) {
    $('pinHint').textContent = msg;
    $('pinHint').classList.toggle('err', !!err);
  }

  function closePin() {
    $('pinOverlay').classList.remove('show');
    pinValue = pinOld = pinNew = '';
    pinStudent = null;
    pinMode = 'login';
  }

  function doLogin(s, pin) {
    pinBusy = true;
    showLoading(true);
    google.script.run
      .withSuccessHandler(res => {
        pinBusy = false;
        if (!res.ok) {
          showLoading(false);
          if (!INFO.requirePin) { toast(res.message); return; }
          pinFail(res.message);
          return;
        }
        TOKEN = res.token;
        store.set(STORE_KEY, TOKEN);
        closePin();
        fetchDashboard(true);
      })
      .withFailureHandler(err => { pinBusy = false; onError(err); })
      .login(s.num, pin);
  }

  function doLogout() {
    const t = TOKEN;
    TOKEN = null;
    DATA = null;
    store.del(STORE_KEY);
    store.del(ROLE_KEY);
    if (TEACHER) {
      TEACHER = false;
      $('hwHeadTitle').textContent = '📝 과제';
      $('hwHeadSub').textContent = '선생님이 낸 과제를 확인하고 제출해요';
      $('hwOut').style.display = 'none';
      $('inqOut').style.display = 'none';
      $('inqHeadTitle').textContent = '🔍 질문 탐구';
      $('inqHeadSub').textContent = '궁금한 것을 묻고, 알게 된 것을 정리해요';
      $('bookOut').style.display = 'none';
      $('bookHeadTitle').textContent = '📚 독서기록';
      $('bookHeadSub').textContent = '읽은 만큼 기록하고, 느낀 점을 남겨요';
    }
    BOOKS = null;
    BOOKD = null;
    bookSel = null;
    INQ = null;
    INQD = null;
    cloudSel = null;
    HW = null;
    HWD = null;
    hwEdit = false;
    showScreen('loginScreen');
    if (t) google.script.run.logout(t);
  }

  /* ---------- 데이터 ---------- */
  function fetchDashboard(withLoading) {
    if (withLoading) showLoading(true);
    google.script.run
      .withSuccessHandler(res => {
        showLoading(false);
        if (!res || !res.ok) {
          TOKEN = null;
          store.del(STORE_KEY);
          showScreen('loginScreen');
          if (DATA) toast('다시 로그인해 주세요.');
          DATA = null;
          return;
        }
        DATA = res;
        lastFetch = Date.now();
        renderHome();
        const active = document.querySelector('.screen.active');
        if ($('detailScreen').classList.contains('active') && current) renderDetail();
        else if (!active || active.id === 'loginScreen') showScreen('homeScreen');
      })
      .withFailureHandler(onError)
      .getDashboard(TOKEN);
  }

  function refresh() { fetchDashboard(true); }

  /* 날짜별 상태: { 'yyyy-MM-dd': { state: on|late|part, n } } */
  function dayMap(key) {
    const map = {};
    (DATA[key] || []).forEach(r => {
      let state = 'on';
      if (key === 'attendance') state = r.status === '지각' ? 'late' : 'on';
      if (key === 'leftover') state = r.clean ? 'on' : 'part';
      const cur = map[r.d];
      if (!cur) map[r.d] = { state, n: 1 };
      else { cur.n++; if (state === 'on') cur.state = 'on'; }
    });
    return map;
  }

  function summary(key) {
    const list = DATA[key] || [];
    const latest = list[0];
    const recent = latest ? `최근 ${fmtShort(latest.d)}` : '아직 기록이 없어요';
    switch (key) {
      case 'attendance': {
        const late = list.filter(r => r.status === '지각').length;
        return { big: list.length - late, unit: '일', sub: `지각 ${late}번` };
      }
      case 'walk':
        return { big: list.length, unit: '번', sub: latest ? `${latest.text || '운동'} · ${fmtShort(latest.d)}` : recent };
      case 'shine':
        return { big: list.length, unit: '개', sub: latest ? latest.text : recent };
      case 'leftover': {
        const clean = list.filter(r => r.clean).length;
        const avg = list.length ? Math.round(list.reduce((a, r) => a + r.amount, 0) / list.length) : 0;
        return { pre: '다 먹음', big: clean, unit: '번', sub: list.length ? `평균 잔반 ${avg}g` : recent };
      }
      default:
        return { big: list.length, unit: '번', sub: recent };
    }
  }

  /* ---------- 홈 ---------- */
  function renderHome() {
    const s = DATA.student;
    const given = s.name.length >= 3 ? s.name.slice(1) : s.name;
    $('hello').textContent = `안녕, ${given}! 👋`;
    $('helloSub').textContent = `${INFO.className} ${s.num}번 ${s.name}`;

    // 자산
    $('assetAmount').textContent = DATA.asset.toLocaleString();
    const wk = weekKeys(DATA.today);
    const todayInc = DATA.economy.filter(e => e.d === DATA.today).reduce((a, e) => a + e.inc - e.exp, 0);
    const lw = weekKeys(DATA.today, -1);
    const net = list => list.reduce((a, e) => a + e.inc - e.exp, 0);
    const weekInc = net(DATA.economy.filter(e => e.d >= wk[0] && e.d <= wk[4]));
    const lastInc = net(DATA.economy.filter(e => e.d >= lw[0] && e.d <= lw[4]));
    const sign = n => (n > 0 ? '+' : '') + n;
    $('assetChips').innerHTML = `
      <span class="chip">오늘 ${sign(todayInc)}</span>
      <span class="chip">이번 주 ${sign(weekInc)}</span>
      <span class="chip">지난 주 ${sign(lastInc)}</span>`;
    $('pinNudge').style.display = DATA.mustChange ? 'flex' : 'none';

    // 활동 카드
    $('cards').innerHTML = Object.keys(ITEMS).map(key => {
      const it = ITEMS[key];
      const sm = summary(key);
      const map = dayMap(key);
      const t = map[DATA.today];
      let today = '';
      if (t) {
        if (t.state === 'late') today = '<span class="c-today late">오늘 지각</span>';
        else if (key === 'leftover' && t.state === 'part') today = '<span class="c-today">오늘 측정</span>';
        else today = `<span class="c-today">오늘 ✓${t.n > 1 ? ' ' + t.n : ''}</span>`;
      }
      const dots = wk.map((d, i) => {
        const m = map[d];
        const cls = [m ? m.state : '', d === DATA.today ? 'today' : ''].join(' ');
        return `<div class="wd ${cls}"><i></i><span>${'월화수목금'[i]}</span></div>`;
      }).join('');
      return `
        <button class="card" style="--c:${it.color}" onclick="openDetail('${key}')">
          <div class="c-head">
            <span class="c-icon">${it.icon}</span>
            <span class="c-title">${it.title}</span>
            ${today}
          </div>
          <div class="c-big">${sm.pre ? `<span class="pre">${sm.pre}</span>` : ''}<b>${sm.big}</b><small>${sm.unit}</small></div>
          <div class="c-sub">${esc(sm.sub)}</div>
          <div class="week">${dots}</div>
        </button>`;
    }).join('');

    renderHwBanner();
    renderCompare();
    $('updated').textContent = `${DATA.updated} 기준 · 🔄를 누르면 새로 불러와요`;
  }


  /* ---------- 지난 주와 비교 ---------- */
  // 비교할 값: higher=true면 많을수록 좋아요
  const CMP = {
    attendance: { label: '출석', desc: '제시간에 출석한 날 수', higher: true, val: l => l.filter(r => r.status !== '지각').length },
    milk:       { label: '우유', desc: '우유를 마신 횟수',      higher: true, val: l => l.length },
    brush:      { label: '양치', desc: '양치한 횟수',           higher: true, val: l => l.length },
    walk:       { label: '운동', desc: '운동한 횟수',           higher: true, val: l => l.length },
    shine:      { label: '반짝', desc: '받은 반짝 개수',        higher: true, val: l => l.length },
    leftover:   { label: '잔반', desc: '잔반을 다 먹은 횟수',   higher: true, val: l => l.filter(r => r.clean).length }
  };

  function inWeek(list, wk) { return list.filter(r => r.d >= wk[0] && r.d <= wk[4]); }

  function weekValues(key) {
    const wk = weekKeys(DATA.today, 0);
    const lw = weekKeys(DATA.today, -1);
    const c = CMP[key];
    return { last: c.val(inWeek(DATA[key] || [], lw)), now: c.val(inWeek(DATA[key] || [], wk)) };
  }

  function diffHtml(now, last, higher) {
    const d = now - last;
    if (d === 0) return '<span class="diff">같아요</span>';
    const good = higher ? d > 0 : d < 0;
    return `<span class="diff ${good ? 'good' : 'bad'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d)}</span>`;
  }

  function renderCompare() {
    const todayDow = fromKey(DATA.today).getDay();
    const dayName = DOW[todayDow];
    const midWeek = todayDow >= 1 && todayDow <= 4;
    $('cmpSub').textContent = midWeek ? `이번 주는 ${dayName}요일까지` : '월~금 기준';

    let sumNow = 0, sumLast = 0;
    const rows = Object.keys(CMP).map(key => {
      const it = ITEMS[key];
      const c = CMP[key];
      const v = weekValues(key);
      sumNow += v.now;
      sumLast += v.last;
      const max = Math.max(v.now, v.last, 1);
      return `
        <div class="cmp-row click" style="--c:${it.color}" onclick="openDetail('${key}')">
          <div class="cmp-label"><span>${it.icon}</span>${c.label}</div>
          <div class="cmp-bars">
            <div class="cmp-bar last"><span>지난 주</span><div class="track"><i style="width:${v.last / max * 100}%"></i></div><b>${v.last}</b></div>
            <div class="cmp-bar this"><span>이번 주</span><div class="track"><i style="width:${v.now / max * 100}%"></i></div><b>${v.now}</b></div>
          </div>
          ${diffHtml(v.now, v.last, c.higher)}
        </div>`;
    }).join('');

    let msg;
    if (sumLast === 0 && sumNow === 0) msg = '🌱 이번 주부터 하나씩 기록을 쌓아 봐요!';
    else if (sumNow >= sumLast) msg = `🎉 지난 주보다 ${sumNow - sumLast > 0 ? (sumNow - sumLast) + '개 더 ' : '만큼 '}해냈어요! 멋져요!`;
    else if (midWeek) msg = `💪 지난 주까지 ${sumLast - sumNow}개 남았어요. 남은 요일에 힘내요!`;
    else msg = `💪 지난 주보다 ${sumLast - sumNow}개 적었어요. 다음 주에 다시 도전해요!`;

    $('compare').innerHTML = `<div class="cmp-msg">${msg}</div>${rows}
      <div class="cmp-note">출석은 제시간에 온 날, 잔반은 다 먹은 횟수로 비교해요.</div>`;
  }

  /* 상세 화면: 지난 주 / 이번 주 요일별 점 */
  function weekCompareHtml(key) {
    const it = ITEMS[key];
    const c = CMP[key];
    const map = dayMap(key);
    const v = weekValues(key);
    const line = (label, wk, val) => {
      const dots = wk.map(d => {
        const m = map[d];
        const cls = [m ? m.state : '', d === DATA.today ? 'today' : ''].join(' ');
        return `<div class="wd ${cls}"><i></i></div>`;
      }).join('');
      return `<div class="lbl">${label}</div>${dots}<div class="cnt">${val}</div>`;
    };
    const head = '<div></div>' + '월화수목금'.split('').map(d => `<div class="wd"><span>${d}</span></div>`).join('') + '<div></div>';
    return `
      <div class="panel" style="--c:${it.color}">
        <div class="cal-head" style="margin-bottom:10px">
          <b>📊 지난 주와 비교</b>${diffHtml(v.now, v.last, c.higher)}
        </div>
        <div class="wk-compare">
          ${head}
          ${line('지난 주', weekKeys(DATA.today, -1), v.last)}
          ${line('이번 주', weekKeys(DATA.today, 0), v.now)}
        </div>
        <div class="cmp-note">숫자는 ${c.desc}예요.</div>
      </div>`;
  }

  /* ---------- 상세 ---------- */
  function openDetail(key) {
    current = key;
    ecoFilter = '전체';
    const t = fromKey(DATA.today);
    calY = t.getFullYear();
    calM = t.getMonth();
    renderDetail();
    showScreen('detailScreen');
  }

  function closeDetail() {
    current = null;
    showScreen('homeScreen');
  }

  function renderDetail() {
    if (current === 'economy') { renderEconomy(); return; }
    const it = ITEMS[current];
    $('dTitle').innerHTML = `<span>${it.icon}</span>${it.title}`;
    document.documentElement.style.setProperty('--c', it.color);
    $('dBody').innerHTML = statsHtml(current) + weekCompareHtml(current) + calendarHtml(current) + listHtml(current);
  }

  function statsHtml(key) {
    const list = DATA[key] || [];
    const monthKey = `${calY}-${pad2(calM + 1)}`;
    const wk = weekKeys(DATA.today);
    const inMonth = list.filter(r => r.d.startsWith(monthKey)).length;
    const inWeek = list.filter(r => r.d >= wk[0] && r.d <= wk[4]).length;
    let s;
    if (key === 'attendance') {
      const late = list.filter(r => r.status === '지각').length;
      const rate = list.length ? Math.round((list.length - late) / list.length * 100) : 0;
      s = [['출석', list.length - late, '일'], ['지각', late, '번'], ['제시간 출석', rate, '%']];
    } else if (key === 'leftover') {
      const clean = list.filter(r => r.clean).length;
      const avg = list.length ? Math.round(list.reduce((a, r) => a + r.amount, 0) / list.length) : 0;
      s = [['다 먹음', clean, '번'], ['측정', list.length, '번'], ['평균 잔반', avg, 'g']];
    } else if (key === 'walk') {
      const cnt = {};
      list.forEach(r => { const k = r.text || '기타'; cnt[k] = (cnt[k] || 0) + 1; });
      const top = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
      s = [['전체', list.length, '번'], ['이번 달', inMonth, '번'], ['자주 한 때', top || '-', '']];
    } else {
      const unit = key === 'shine' ? '개' : '번';
      s = [['전체', list.length, unit], ['이번 달', inMonth, unit], ['이번 주', inWeek, unit]];
    }
    return `<div class="stats">${s.map(([l, v, u]) =>
      `<div class="stat"><span>${l}</span><b>${esc(v)}<small>${u}</small></b></div>`).join('')}</div>`;
  }

  function calendarHtml(key) {
    const map = dayMap(key);
    const first = new Date(calY, calM, 1);
    const days = new Date(calY, calM + 1, 0).getDate();
    const todayDt = fromKey(DATA.today);
    const isThisMonth = calY === todayDt.getFullYear() && calM === todayDt.getMonth();

    let cells = DOW.map((d, i) => `<div class="dow ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${d}</div>`).join('');
    for (let i = 0; i < first.getDay(); i++) cells += '<div></div>';
    for (let d = 1; d <= days; d++) {
      const k = `${calY}-${pad2(calM + 1)}-${pad2(d)}`;
      const dow = new Date(calY, calM, d).getDay();
      const m = map[k];
      const cls = ['day', m ? m.state : '', (dow === 0 || dow === 6) ? 'weekend' : '', k === DATA.today ? 'today' : ''].join(' ');
      const extra = m && m.n > 1 ? `<em>×${m.n}</em>` : '';
      cells += `<div class="${cls}">${d}${extra}</div>`;
    }

    let legend = '';
    if (key === 'attendance') {
      legend = `<div class="legend"><span><i style="background:var(--c)"></i>출석</span><span><i style="background:var(--late)"></i>지각</span></div>`;
    } else if (key === 'leftover') {
      legend = `<div class="legend"><span><i style="background:var(--c)"></i>다 먹음</span><span><i style="background:color-mix(in srgb, var(--c) 22%, white)"></i>남김</span></div>`;
    }

    return `
      <div class="panel">
        <div class="cal-head">
          <button class="cal-nav" onclick="moveMonth(-1)">‹</button>
          <b>${calY}년 ${calM + 1}월</b>
          <button class="cal-nav" onclick="moveMonth(1)" ${isThisMonth ? 'disabled' : ''}>›</button>
        </div>
        <div class="cal">${cells}</div>
        ${legend}
      </div>`;
  }

  function moveMonth(step) {
    calM += step;
    if (calM < 0) { calM = 11; calY--; }
    if (calM > 11) { calM = 0; calY++; }
    renderDetail();
  }

  function listHtml(key) {
    const monthKey = `${calY}-${pad2(calM + 1)}`;
    const list = (DATA[key] || []).filter(r => r.d.startsWith(monthKey));
    const title = `<div class="list-title">${calM + 1}월 기록 ${list.length ? `<span style="color:var(--sub);font-weight:700">${list.length}</span>` : ''}</div>`;
    if (!list.length) return `${title}<div class="panel"><div class="empty">이 달에는 기록이 없어요</div></div>`;

    const rows = list.map(r => {
      const dt = fromKey(r.d);
      const date = `<div class="r-date"><b>${dt.getDate()}</b><span>${DOW[dt.getDay()]}</span></div>`;
      let main = '', sub = r.t ? `${r.t}` : '', right = '';
      switch (key) {
        case 'attendance':
          main = r.status === '지각' ? '지각했어요' : '제시간에 왔어요';
          if (r.reason) sub += ` · ${esc(r.reason)}`;
          right = `<span class="badge ${r.status === '지각' ? 'late' : ''}">${esc(r.status)}</span>`;
          break;
        case 'milk':
          main = '우유를 마셨어요'; right = '🥛'; break;
        case 'brush':
          main = '양치를 했어요'; right = '🪥'; break;
        case 'walk':
          main = esc(r.text || '운동');
          if (r.memo) sub += ` · ${esc(r.memo)}`;
          right = '🚶';
          break;
        case 'shine':
          main = esc(r.text || '반짝'); right = '✨'; break;
        case 'leftover': {
          const w = Math.min(100, Math.round(r.amount / 300 * 100));
          main = r.clean ? '다 먹었어요 🌱' : `${r.amount}g 남겼어요`;
          if (r.measure) sub += ` · 측정 ${r.measure}g`;
          if (!r.clean) sub += `<div class="bar"><i style="width:${w}%"></i></div>`;
          right = r.clean ? '🌱' : '';
          break;
        }
      }
      return `<div class="row">${date}<div class="r-main"><div class="r-title">${main}</div><div class="r-sub">${sub}</div></div><div class="r-right">${right}</div></div>`;
    }).join('');
    return `${title}<div class="panel"><div class="list">${rows}</div></div>`;
  }

  /* ---------- 경제활동 상세 ---------- */
  function renderEconomy() {
    $('dTitle').innerHTML = '<span>🪙</span>경제활동';
    const all = DATA.economy;
    const inc = all.reduce((a, e) => a + e.inc, 0);
    const exp = all.reduce((a, e) => a + e.exp, 0);

    const counts = {};
    all.forEach(e => { counts[e.content] = (counts[e.content] || 0) + 1; });
    const cats = ['전체', ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])];
    ECO_CATS = cats;
    if (!cats.includes(ecoFilter)) ecoFilter = '전체';

    const stats = `
      <div class="stats">
        <div class="stat"><span>내 자산</span><b>${DATA.asset.toLocaleString()}</b></div>
        <div class="stat"><span>모은 돈</span><b class="up">+${inc.toLocaleString()}</b></div>
        <div class="stat"><span>쓴 돈</span><b class="down">${exp ? '-' + exp.toLocaleString() : '0'}</b></div>
      </div>`;

    const filters = `<div class="filters">${cats.map(c =>
      `<button class="filter ${c === ecoFilter ? 'on' : ''}" onclick="setEcoFilter(${cats.indexOf(c)})">${esc(c === '전체' ? c : ecoLabel(c))}${c !== '전체' ? ' ' + counts[c] : ''}</button>`).join('')}</div>`;

    const list = ecoFilter === '전체' ? all : all.filter(e => e.content === ecoFilter);
    let body = '';
    if (!list.length) {
      body = '<div class="panel"><div class="empty">아직 경제활동 기록이 없어요</div></div>';
    } else {
      const groups = {};
      const order = [];
      list.forEach(e => { if (!groups[e.d]) { groups[e.d] = []; order.push(e.d); } groups[e.d].push(e); });
      body = '<div class="panel" style="padding-top:4px"><div class="list">' + order.map(d => {
        const g = groups[d];
        const net = g.reduce((a, e) => a + e.inc - e.exp, 0);
        const head = `<div class="group-head"><b>${fmtDay(d)}${d === DATA.today ? ' · 오늘' : ''}</b><span style="color:${net >= 0 ? 'var(--up)' : 'var(--down)'}">${net >= 0 ? '+' : ''}${net}</span></div>`;
        const rows = g.map(e => {
          const memo = e.memo && !e.memo.startsWith('기존 ') ? ` · ${esc(e.memo)}` : '';
          const amt = e.inc ? `<div class="r-right up">+${e.inc}</div>` : `<div class="r-right down">-${e.exp}</div>`;
          return `<div class="row"><div class="r-icon">${ECO_ICONS[e.content] || '🪙'}</div><div class="r-main"><div class="r-title">${esc(ecoLabel(e.content))}</div><div class="r-sub">${e.t}${memo}</div></div>${amt}</div>`;
        }).join('');
        return head + rows;
      }).join('') + '</div></div>';
    }

    $('dBody').innerHTML = stats + filters + body;
  }

  function setEcoFilter(i) {
    ecoFilter = ECO_CATS[i] || '전체';
    renderEconomy();

  /* =================================================================
     과제
     ================================================================= */
  let HW = null;              // 과제 목록
  let HWD = null;             // 열려 있는 과제
  let hwEdit = false;         // 제출 폼을 보고 있는지
  let draftImgs = [];         // [{ id: 기존 파일 ID } 또는 { data: 새 사진 data URL }]
  const IMG = {};             // 이미지 캐시 { fileId: dataURL }
  const IMG_WAIT = {};
  const MAX_IMAGES = 3;

  function goTab(tab) {
    if (tab === 'home') { showScreen('homeScreen'); return; }

    const s = DATA && DATA.hw;

    if (!s || !s.total) { b.style.display = 'none'; dot.style.display = 'none'; return; }
    const need = s.todo + s.redo;

  function dueInfo(due, today) {
    if (!due) return { text: '마감 없음', cls: 'none' };
    const d = Math.round((fromKey(due) - fromKey(today)) / 86400000);
    if (d < 0) return { text: '마감 지남', cls: '' };
    if (d === 0) return { text: '오늘 마감', cls: 'soon' };
    if (d === 1) return { text: '내일 마감', cls: 'soon' };
    return { text: `D-${d}`, cls: '' };
  }

  function statusBadge(my) {
    if (!my) return '<span class="st none">안 냈어요</span>';
    const s = my.status || '제출';
    const map = { '제출': ['done', '냈어요'], '늦음': ['late', '늦게 냈어요'], '확인': ['ok', '선생님 확인 ✓'], '다시 내기': ['redo', '다시 내기'] };
    const m = map[s] || ['done', s];
    return `<span class="st ${m[0]}">${m[1]}</span>`;
  }

  function renderHwList() {
    if (TEACHER) { renderTeacherList(); return; }
    const list = HW.list;
    if (!list.length) {
      $('hwList').innerHTML = '<div class="panel"><div class="locked"><i>📭</i>아직 올라온 과제가 없어요</div></div>';
      return;

    const todo = [], done = [], closed = [];
    list.forEach(a => {
      if (a.my && a.my.status === '다시 내기') todo.push(a);
      else if (!a.my && a.status === '진행') todo.push(a);
      else if (!a.my) closed.push(a);
      else done.push(a);
    });
    const byDue = (x, y) => (x.due || '9999') .localeCompare(y.due || '9999');
    todo.sort(byDue);
    done.sort((x, y) => (y.date || '').localeCompare(x.date || ''));

      const di = dueInfo(a.due, HW.today);
      const dueTag = a.status === '마감' ? '<span class="tag due none">마감됨</span>' : `<span class="tag due ${di.cls}">${di.text}</span>`;
      return `
        <button class="hw-card" onclick="openHw('${esc(a.id)}')">

  async function onFilesPicked(e) {
    const files = [...e.target.files];
    e.target.value = '';
    const room = MAX_IMAGES - draftImgs.length;
    if (files.length > room) toast(`사진은 ${MAX_IMAGES}장까지예요. ${room}장만 넣을게요.`);
    showLoading(true);
    try {
      for (const f of files.slice(0, room)) {
        if (!f.type.startsWith('image/')) continue;
        draftImgs.push({ data: await shrinkImage(f, 1280, 0.82) });
      }
    } catch (err) {
      toast('사진을 불러오지 못했어요. 다른 사진으로 해 볼까요?');
    }
    showLoading(false);
    redrawDraft();
  }

  /* 사진을 긴 쪽 maxSide px 이하 JPEG로 줄이기 */
  function shrinkImage(file, maxSide, quality) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        let { width: w, height: h } = img;
        const s = Math.min(1, maxSide / Math.max(w, h));
        w = Math.round(w * s); h = Math.round(h * s);
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
      img.src = url;
    });
  }

  function submitHw() {
    const a = HWD.a;
    const ta = $('hwText');
    const text = ta ? ta.value.trim() : '';
    if (!text) { toast('글을 꼭 써야 낼 수 있어요.'); ta && ta.focus(); return; }

    const keep = draftImgs.filter(d => d.id).map(d => d.id);
    const fresh = draftImgs.filter(d => d.data).map(d => d.data);
    const btn = $('hwSubmit');
    btn.disabled = true;
    btn.textContent = fresh.length ? '사진 올리는 중…' : '내는 중…';
    showLoading(true);

    google.script.run
      .withSuccessHandler(res => {
        showLoading(false);
        if (!res.ok) {
          btn.disabled = false;
          btn.textContent = HWD.mine ? '고쳐서 다시 내기' : '📤 과제 내기';
          if (res.reason === 'auth') { authExpired(); return; }
          toast(res.message || '내지 못했어요.');
          return;
        }
        // 새로 올린 사진은 캐시에 넣어서 다시 받지 않게
        const newIds = res.mine.images.filter(id => !keep.includes(id));
        newIds.forEach((id, i) => { if (fresh[i]) IMG[id] = fresh[i]; });
        setHwData(res);
        hwEdit = false;
        renderHwDetail();
        window.scrollTo(0, 0);
        toast(res.edited ? '✏️ 고친 과제를 냈어요!' : (res.a.reward ? `📤 과제를 냈어요! 선생님이 확인하면 🪙${res.a.reward}야호를 받아요` : '📤 과제를 냈어요!'));

      .submitWork(TOKEN, a.id, text, keep, fresh);

        if (!res.ok) { res.reason === 'auth' ? authExpired() : toast(res.message); return; }
        updatePost(res.item);
      })
      .withFailureHandler(err => { reacting = false; onError(err); })
      .toggleLike(TOKEN, sid);
  }

  function sendComment(sid) {
    const input = $('ci-' + sid);
    const text = input.value.trim();
    if (!text || reacting) return;
    reacting = true;
    input.disabled = true;
    google.script.run
      .withSuccessHandler(res => {
        reacting = false;
        input.disabled = false;
        if (!res.ok) { res.reason === 'auth' ? authExpired() : toast(res.message); return; }
        updatePost(res.item);
      })
      .withFailureHandler(err => { reacting = false; input.disabled = false; onError(err); })
      .addComment(TOKEN, sid, text);
  }

  function delComment(cid) {
    if (!confirm('이 댓글을 지울까요?')) return;
    google.script.run
      .withSuccessHandler(res => {
        if (!res.ok) { res.reason === 'auth' ? authExpired() : toast(res.message); return; }
        updatePost(res.item);
      })
      .withFailureHandler(onError)
      .deleteComment(TOKEN, cid);
  }

  /* ---------- 이미지 불러오기 (한 번 받은 건 다시 안 받음) ---------- */
  function loadImages(root) {
    if (!root) return;
    root.querySelectorAll('img[data-fid]').forEach(img => {
      const id = img.dataset.fid;
      if (img.getAttribute('src')) return;
      if (IMG[id]) { img.src = IMG[id]; return; }
      (IMG_WAIT[id] = IMG_WAIT[id] || []).push(img);
      if (IMG_WAIT[id].length > 1) return;
      google.script.run
        .withSuccessHandler(res => {
          const waiting = IMG_WAIT[id] || [];
          delete IMG_WAIT[id];
          if (!res || !res.ok) { waiting.forEach(el => { el.alt = '사진을 볼 수 없어요'; }); return; }
          IMG[id] = res.src;
          waiting.forEach(el => { el.src = res.src; });
          document.querySelectorAll(`img[data-fid="${id}"]:not([src])`).forEach(el => { el.src = res.src; });
        })
        .withFailureHandler(() => { delete IMG_WAIT[id]; })
        .getImage(TOKEN, id);
    });
  }

  function openViewer(img) {
    if (!img.src) return;
    $('viewerImg').src = img.src;
    $('viewer').classList.add('show');
  }
  function closeViewer() { $('viewer').classList.remove('show'); }



  /* =================================================================
     질문 탐구
     ================================================================= */
  let INQ = null;            // 목록
  let INQD = null;           // 열려 있는 탐구 (새 탐구면 { inq: null })
  let inqTab = 'chat';
  let asking = false;
  const STARTERS = ['🌌 우주는 어디까지 있을까요?', '🦖 공룡은 왜 사라졌나요?', '🌈 무지개는 왜 생겨요?', '🧠 꿈은 왜 꾸는 걸까요?', '🐝 꿀벌이 사라지면 어떻게 돼요?'];

  function loadInquiries(withLoading) {
    if (withLoading) showLoading(true);
    google.script.run
      .withSuccessHandler(res => {
        showLoading(false);
        if (!res.ok) { if (res.reason === 'auth') authExpired(); return; }
        INQ = res;
        renderInqList();
      })
      .withFailureHandler(onError)
      .getInquiries(TOKEN);
  }

  function renderInqList() {
    let L = INQ.list;
    let html = cloudHtml();
    if (cloudSel) {
      const c = (INQ.cloud || []).find(x => x.w === cloudSel);
      const ids = c ? c.t : [];
      L = L.filter(t => ids.includes(t.id));
    }
    if (!TEACHER) {
      const r = INQ.rules;
      html += `
        <button class="new-inq" onclick="openInq(null)">
          <i>✨</i><span style="text-align:left"><b>새 탐구 시작하기</b><span>궁금한 것을 AI 도우미에게 물어봐요</span></span>
        </button>
        <div class="rule-card">
          🪙 탐구한 내용을 <b>스스로 정리</b>하면 <b>${r.reward}야호</b>!<br>
          · 처음 정리: 질문 ${r.firstQ}번 이상 + ${r.firstLen}자 이상<br>
          · 보완 정리: 추가 질문 ${r.moreQ}번 이상 + 내용 고치기<br>
          · 하루에 한 번만 받을 수 있어요 ${INQ.rewardedToday ? '<b>(오늘은 받았어요 ✓)</b>' : ''}
        </div>`;
    }
    if (!L.length) {
      html += `<div class="panel"><div class="locked"><i>💭</i>${TEACHER ? '아직 학생들이 시작한 탐구가 없어요' : '아직 탐구가 없어요. 첫 질문을 해 볼까요?'}</div></div>`;
      $('inqList').innerHTML = html;
      return;
    }
    let list = L;
    if (TEACHER) {
      const flagged = L.filter(t => t.flagged);
      const rest = L.filter(t => !t.flagged);
      if (flagged.length) html += `<div class="hw-group" style="color:var(--down)">⚠️ 확인이 필요한 대화 ${flagged.length}</div>` + flagged.map(inqItemHtml).join('');
      html += `<div class="hw-group">📚 ${cloudSel ? `'${esc(cloudSel)}'이 나온 탐구` : '전체 탐구'} ${L.length}</div>`;
      list = rest;
    } else {
      html += `<div class="hw-group">💬 ${cloudSel ? `'${esc(cloudSel)}'이 나온 탐구` : '나의 탐구'} ${L.length}</div>`;

  /* ---------- 낱말 구름 ---------- */
  let cloudSel = null;
  const CLOUD_COLORS = ['#3f9b4b', '#4a8fd1', '#8a5cd1', '#e0703a', '#22aa9a', '#d0567a', '#b37400', '#3b5bdb'];

  function cloudHtml() {
    const words = INQ.cloud || [];
    const title = TEACHER ? '☁️ 우리 반 탐구 낱말 구름' : '☁️ 나의 탐구 낱말 구름';
    if (words.length < 3) {
      return TEACHER ? '' : `<div class="cloud-card"><div class="cloud-head"><b>${title}</b></div>
        <div class="cloud-empty">질문하고 정리할수록 내 낱말 구름이 자라요 🌱</div></div>`;
    }
    const max = words[0].n, min = words[words.length - 1].n;
    const size = n => max === min ? 24 : Math.round(15 + (Math.sqrt(n - min) / Math.sqrt(max - min)) * 27);
    // 큰 낱말이 가운데 오도록 좌우로 번갈아 놓기
    const arranged = [];
    words.forEach((w, i) => (i % 2 ? arranged.push(w) : arranged.unshift(w)));
    const btns = arranged.map(w => {
      const color = CLOUD_COLORS[hashStr(w.w) % CLOUD_COLORS.length];
      const sel = cloudSel === w.w;
      return `<button class="cw ${sel ? 'on' : ''} ${cloudSel && !sel ? 'dim' : ''}" style="font-size:${size(w.n)}px;--cw:${color}"
        title="${w.n}번" onclick="pickWord('${esc(w.w).replace(/'/g, "\\'")}')">${esc(w.w)}</button>`;
    }).join('');
    return `
      <div class="cloud-card">
        <div class="cloud-head"><b>${title}</b><span>${cloudSel ? `<button class="cloud-clear" onclick="pickWord(null)">전체 보기 ✕</button>` : '낱말을 눌러 보세요'}</span></div>
        <div class="cloud">${btns}</div>
        <div class="cloud-foot">${TEACHER ? '학생들의 질문과 정리' : '내가 한 질문과 정리'}에서 많이 쓴 낱말일수록 크게 보여요</div>
      </div>`;
  }

  function pickWord(w) {
    cloudSel = cloudSel === w ? null : w;
    renderInqList();
  }

  function hashStr(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h;
  }

  function inqItemHtml(t) {
    return `
      <button class="inq-item ${t.flagged ? 'flag' : ''}" onclick="openInq('${esc(t.id)}')">
        <span class="ic">${t.flagged ? '⚠️' : '🔍'}</span>
        <span class="tx">
          <div class="tt">${TEACHER ? `${t.num}번 ${esc(t.name)} · ` : ''}${esc(t.title)}</div>
          <div class="pv">${esc(t.preview || '')}</div>
          <div class="meta">
            <span class="tag">💬 질문 ${t.questions}</span>
            <span class="tag ${t.summaries ? 'subj' : ''}">📒 정리 ${t.summaries ? t.summaries + '차' : '아직'}</span>
          </div>
        </span>
        <span class="tm">${esc(t.updated)}</span>
      </button>`;
  }

  function openInq(id) {
    inqTab = 'chat';
    if (!id) {
      INQD = { inq: null, messages: [], summaries: [], rules: INQ ? INQ.rules : null,
               usedToday: INQ ? INQ.usedToday : 0, maxPerDay: INQ ? INQ.maxPerDay : 20, progress: null };
      showInq();
      setTimeout(() => $('qInput').focus(), 100);
      return;
    }
    showLoading(true);
    google.script.run
      .withSuccessHandler(res => {
        showLoading(false);
        if (!res.ok) { res.reason === 'auth' ? authExpired() : toast(res.message); return; }
        INQD = res;
        showInq();
      })
      .withFailureHandler(onError)
      .getInquiry(TOKEN, id);
  }

  const WIDE = () => window.matchMedia('(min-width: 900px)').matches;
  let lastWide = null;

  function showInq() {
    $('inqTitle').textContent = INQD.inq ? (TEACHER ? `${INQD.inq.num}번 ${INQD.inq.name} · ` : '') + INQD.inq.title : '새 탐구';
    $('inqRename').style.display = INQD.inq && !TEACHER ? '' : 'none';
    renderInq();
    showScreen('inqChatScreen');
    scrollBottom();
  }

  function closeInq() {
    const draft = $('sumText');
    if (draft && draft.value.trim() && draft.dataset.orig !== draft.value && !confirm('정리한 내용이 저장되지 않았어요. 나갈까요?')) return;
    INQD = null;
    undockChatBar();
    showScreen('inqScreen');
    loadInquiries(false);
  }

  function setInqTab(tab) {
    inqTab = tab;
    const split = document.querySelector('.inq-split');
    if (split) split.dataset.tab = tab;
    updateSeg();
    updateChatBar('inqChatScreen');
    if (tab === 'chat') scrollBottom();
  }

  /* 전체 그리기: 왼쪽 대화 + 오른쪽 정리 (좁은 화면에서는 탭으로 하나씩) */
  function renderInq() {
    undockChatBar();                 // 입력창이 대화 칸 안에 있으면 지워지지 않게 먼저 밖으로 꺼내요
    $('inqBody').innerHTML = `
      <div class="inq-split" data-tab="${inqTab}">
        <div class="col-chat" id="colChat">
          <div class="col-head">💬 대화</div>
          <div class="chat-scroll" id="chatScroll">${chatHtml()}</div>
        </div>
        <div class="col-sum" id="colSum">${sumHtml()}</div>
      </div>`;
    bindSum();
    updateSeg();
    placeChatBar();
    updateLeft();
  }

  /* 질문을 보낸 뒤: 대화만 다시 그리고, 쓰던 정리는 그대로 둬요 */
  function renderChatOnly() {
    $('chatScroll').innerHTML = chatHtml();
    if (!TEACHER && INQD.inq && !$('sumText')) { $('colSum').innerHTML = sumHtml(); bindSum(); }
    else updateSumProgress();
    updateSeg();
    updateLeft();
    scrollBottom();
  }

  function renderSumOnly() {
    $('colSum').innerHTML = sumHtml();
    bindSum();
    updateSeg();
  }

  function bindSum() {
    const ta = $('sumText');
    if (!ta) return;
    ta.dataset.orig = ta.value;
    ta.addEventListener('input', updateSumProgress);
    updateSumProgress();
  }

  function updateSeg() {
    $('segChat').classList.toggle('on', inqTab === 'chat');
    $('segSum').classList.toggle('on', inqTab === 'sum');
    $('segSum').textContent = `📒 정리${INQD.summaries.length ? ` (${INQD.summaries.length})` : ''}`;
    $('inqSeg').style.display = INQD.inq && !WIDE() ? 'flex' : 'none';
  }

  function chatHtml() {
    let html = `<div class="ai-note">🤖 이 도우미는 사람이 아니라 <b>AI</b>예요. 틀릴 수도 있으니 책이나 믿을 만한 자료로 꼭 확인해요. 이름·전화번호 같은 개인정보는 쓰지 않아요. 선생님이 대화를 볼 수 있어요.</div>`;
    const msgs = INQD.messages;
    if (!msgs.length) {
      html += `<div class="chat-empty"><i>💭</i>무엇이 궁금한가요?<br>아래 칸에 질문을 써서 탐구를 시작해요.
        ${TEACHER ? '' : `<div class="starters">${STARTERS.map((s, i) => `<button onclick="useStarter(${i})">${esc(s)}</button>`).join('')}</div>`}</div>`;
      return html + '<div class="chat" id="chatList"></div>';
    }
    html += '<div class="chat" id="chatList">' + msgs.map((m, i) => bubbleHtml(m, i === msgs.length - 1)).join('') + '</div>';
    return html;
  }

  function bubbleHtml(m, isLast) {
    if (m.who === '학생') {
      return `<div class="bub me ${m.flag ? 'flag' : ''}">${esc(m.text)}<span class="t">${esc(m.time)}</span></div>`;
    }
    const nexts = m.next && m.next.length ? `
      <div class="nexts"><small>💡 이어서 생각해 볼 질문</small>
        ${m.next.map(q => `<button class="next" ${TEACHER ? 'disabled' : ''} onclick="useNext(this)">${esc(q)}</button>`).join('')}
      </div>` : '';
    return `<div class="bub ai ${m.flag ? 'flag' : ''}">
      ${m.flag ? '<span class="warn">⚠️ 선생님 확인 필요</span>' : ''}
      <span class="who">🤖 AI 도우미</span><div class="txt">${esc(m.text)}</div>${nexts}<span class="t">${esc(m.time)}</span></div>`;
  }

  function useStarter(i) {
    $('qInput').value = STARTERS[i].replace(/^\S+\s/, '');
    autoGrow();
    $('qInput').focus();
  }

  function useNext(btn) {
    $('qInput').value = btn.textContent.trim();
    autoGrow();
    $('qInput').focus();
  }

  function sendQuestion() {
    if (asking || TEACHER) return;
    const ta = $('qInput');
    const text = ta.value.trim();
    if (!text) { ta.focus(); return; }
    if (INQD.usedToday >= INQD.maxPerDay) { toast(`오늘은 질문을 ${INQD.maxPerDay}번 다 했어요. 내일 이어서 해요!`); return; }

    asking = true;
    $('qSend').disabled = true;
    ta.value = '';
    autoGrow();

    // 화면에 먼저 내 질문과 '생각 중'을 보여줘요
    const empty = document.querySelector('#chatScroll .chat-empty');
    if (empty) empty.remove();
    const list = $('chatList');
    list.insertAdjacentHTML('beforeend', `<div class="bub me">${esc(text)}<span class="t">방금</span></div><div class="typing" id="typing"><i></i><i></i><i></i></div>`);
    scrollBottom();

    google.script.run
      .withSuccessHandler(res => {
        asking = false;
        $('qSend').disabled = false;
        if (!res.ok) {
          const tp = $('typing'); if (tp) tp.remove();
          const mines = list.querySelectorAll('.bub.me'); if (mines.length) mines[mines.length - 1].remove();
          ta.value = text;
          autoGrow();
          if (res.reason === 'auth') { authExpired(); return; }
          toast(res.message || '보내지 못했어요.');
          return;
        }
        const wasNew = !INQD.inq;
        INQD = res;
        INQ = null;          // 목록은 돌아갈 때 새로 받기
        if (wasNew) showInq();
        else renderChatOnly();
      })
      .withFailureHandler(err => {
        asking = false;
        $('qSend').disabled = false;
        const tp = $('typing'); if (tp) tp.remove();
        ta.value = text;
        onError(err);
      })
      .askQuestion(TOKEN, INQD.inq ? INQD.inq.id : null, text);
  }

  function sumHtml() {
    const S = INQD.summaries;
    const last = S[S.length - 1];
    let html = '';
    if (!INQD.inq) {
      return `<div class="panel"><div class="locked"><i>📒</i>첫 질문을 하면 여기에서<br>알게 된 것을 정리할 수 있어요</div></div>`;
    }
    if (!TEACHER) {
      const p = INQD.progress;
      html += `
        <div class="panel">
          <div class="field-label">📒 ${last ? '정리 고치고 보완하기' : '내가 알게 된 것 정리하기'} <span id="sumCount">0자</span></div>
          <div class="my-meta" style="margin:0 0 10px">대화를 보면서 알게 된 것·새로 궁금해진 것·내 생각을 <b>내 말로</b> 써요.</div>
          <textarea class="sum-text" id="sumText" maxlength="3000" placeholder="예) 블랙홀은 중력이 아주 강해서 빛도 빠져나오지 못한다는 걸 알게 되었다. 그런데 ...">${esc(last ? last.text : '')}</textarea>
          <div class="prog" id="sumProg"></div>
          <div class="my-meta" id="sumHint" style="margin-top:6px"></div>
          <div class="btn-row"><button class="btn primary" id="sumSave" onclick="saveSum()">💾 정리 저장하기</button></div>
        </div>`;
    }
    html += `<div class="sec-title" style="margin-top:18px"><h2>📚 정리 기록</h2><span>${S.length ? S.length + '번 정리했어요' : ''}</span></div>`;
    if (!S.length) {
      html += `<div class="panel"><div class="locked"><i>📝</i>${TEACHER ? '아직 정리하지 않았어요' : '아직 정리한 내용이 없어요'}</div></div>`;
    } else {
      html += '<div class="panel">' + S.slice().reverse().map(s => `
        <div class="sum-hist">
          <div class="hd">${s.nth}차 정리 <span>${esc(s.time)} · ${s.len}자</span>
            <em class="${s.yaho ? 'got' : ''}">${s.yaho ? `🪙 +${s.yaho}야호` : esc(s.note || '야호 없음')}</em></div>
          <p>${esc(s.text)}</p>
        </div>`).join('') + '</div>';
    }
    return html;
  }

  function updateSumProgress() {
    const ta = $('sumText');
    if (!ta || !INQD.progress) return;
    const p = INQD.progress;
    const len = ta.value.trim().length;
    const last = INQD.summaries[INQD.summaries.length - 1];
    const changed = !last || ta.value.trim() !== last.text.trim();
    $('sumCount').textContent = `${len}자`;
    const qOk = p.questions >= p.needQ;
    const lOk = p.first ? len >= p.needLen : changed;
    $('sumProg').innerHTML = `
      <div class="${qOk ? 'ok' : ''}">${p.first ? '질문' : '추가 질문'}<b>${Math.min(p.questions, p.needQ)} / ${p.needQ}</b></div>
      <div class="${lOk ? 'ok' : ''}">${p.first ? '글자 수' : '내용 고치기'}<b>${p.first ? `${Math.min(len, p.needLen)} / ${p.needLen}` : (changed ? '✓' : '아직')}</b></div>
      <div class="${!p.rewardedToday ? 'ok' : ''}">오늘 보상<b>${p.rewardedToday ? '받았어요' : '가능'}</b></div>`;
    let hint;
    if (p.rewardedToday) hint = '오늘은 이미 야호를 받았어요. 정리는 계속 저장할 수 있어요!';
    else if (!qOk) hint = `질문을 ${p.needQ - p.questions}번 더 하고 정리하면 ${INQD.rules.reward}야호를 받아요.`;
    else if (!lOk) hint = p.first ? `${p.needLen - len}자 더 쓰면 ${INQD.rules.reward}야호를 받아요.` : '내용을 고치거나 보완하면 야호를 받아요.';
    else hint = `🪙 지금 저장하면 ${INQD.rules.reward}야호를 받아요!`;
    $('sumHint').textContent = hint;
    $('sumSave').disabled = !len;
  }

  function saveSum() {
    const ta = $('sumText');
    const text = ta.value.trim();
    if (!text) { toast('정리한 내용을 써 주세요.'); return; }
    showLoading(true);
    google.script.run
      .withSuccessHandler(res => {
        showLoading(false);
        if (!res.ok) { res.reason === 'auth' ? authExpired() : toast(res.message); return; }
        INQD = res;
        INQ = null;
        renderSumOnly();
        const s = res.saved;
        toast(s.yaho ? `🪙 ${s.nth}차 정리 완료! ${s.yaho}야호를 받았어요` : `📒 ${s.nth}차 정리를 저장했어요 (${s.reason})`);
        if (s.yaho && DATA) fetchDashboard(false);
      })
      .withFailureHandler(onError)
      .saveSummary(TOKEN, INQD.inq.id, text);
  }

  function renameInq() {
    if (!INQD || !INQD.inq) return;
    const t = prompt('탐구 제목을 바꿔요', INQD.inq.title);
    if (t === null || !t.trim()) return;

        INQD.inq.title = res.title;
        $('inqTitle').textContent = res.title;
        INQ = null;
      })
      .withFailureHandler(onError)
      .renameInquiry(TOKEN, INQD.inq.id, t);

  function updateChatBar(id) {
    const open = id === 'inqChatScreen';
    const wide = WIDE();
    const show = open && !TEACHER && (wide || inqTab === 'chat');
    if ($('chatBar')) $('chatBar').style.display = show ? 'block' : 'none';
    document.body.classList.toggle('chat-mode', show && !wide);
    document.body.classList.toggle('inq-open', open);

  function undockChatBar() {
    const bar = $('chatBar');
    if (bar && bar.parentNode !== document.body) document.body.appendChild(bar);
    if (bar) bar.classList.remove('docked');
  }

  /* 넓은 화면: 입력창을 왼쪽 대화 칸 아래에 붙여요 / 좁은 화면: 화면 맨 아래에 고정 */
  function placeChatBar() {
    const bar = $('chatBar');
    const col = $('colChat');
    if (WIDE() && col && !TEACHER) {
      if (bar.parentNode !== col) col.appendChild(bar);
      bar.classList.add('docked');
    } else {
      if (bar.parentNode !== document.body) document.body.appendChild(bar);
      bar.classList.remove('docked');
    }

    const w = WIDE();
    if (w === lastWide) return;
    lastWide = w;
    if (!INQD || !$('inqChatScreen').classList.contains('active')) return;
    placeChatBar();
    updateSeg();

    $('qLeft').textContent = `오늘 남은 질문 ${left}번`;

      html += `<div class="hw-group">${label} ${items.length}</div>` + items.map(a => {

          <button class="hw-card" onclick="openHw('${esc(a.id)}')">

  let bookTab = 'log';

  function loadBooks(withLoading) {
    if (withLoading) showLoading(true);

      .withSuccessHandler(res => {
