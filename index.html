  function renderBookList() {
    const R = BOOKS.rules;
    let L = BOOKS.list;
    if (bookSel) {
      const c = (BOOKS.cloud || []).find(x => x.w === bookSel);
      const ids = c ? c.t : [];
      L = L.filter(b => ids.includes(b.id));
    }
    let html = bookCloudHtml();
    const st = BOOKS.stats;
    html += `
      <div class="stats">
        <div class="stat"><span>${TEACHER ? '등록된 책' : '내 책'}</span><b>${st.books}<small>권</small></b></div>
        <div class="stat"><span>다 읽은 책</span><b class="up">${st.finished}<small>권</small></b></div>
        <div class="stat"><span>읽은 쪽수</span><b>${st.pages.toLocaleString()}<small>쪽</small></b></div>
      </div>`;
    if (!TEACHER) {
      html += `
        <button class="new-inq" onclick="openBookForm(false)">
          <i>📘</i><span style="text-align:left"><b>새 책 등록하기</b><span>지금 읽고 있는 책을 추가해요</span></span>
        </button>
        <div class="rule-card">
          🪙 <b>${R.minPages}쪽 이상</b> 읽고 <b>한 줄 생각</b>을 남기면 <b>${R.reward}야호</b> (하루 1번) ${BOOKS.readRewardedToday ? '<b>· 오늘은 받았어요 ✓</b>' : ''}<br>
          📚 <b>끝 쪽까지</b> 읽고 + 감상문 <b>${R.minReview}자 이상</b> + <b>${R.minDays}일 이상</b> 기록하면 <b>${R.bookReward}야호</b> (책마다 1번)
        </div>`;
    }
    if (!L.length) {
      html += `<div class="panel"><div class="locked"><i>📖</i>${bookSel ? '이 낱말이 나온 책이 없어요' : TEACHER ? '아직 학생들이 등록한 책이 없어요' : '아직 등록한 책이 없어요. 읽고 있는 책을 등록해 볼까요?'}</div></div>`;
      $('bookList').innerHTML = html;
      return;
    }
    const reading = L.filter(b => !b.finished);
    const done = L.filter(b => b.finished);
    const label = bookSel ? ` · '${esc(bookSel)}'` : '';
    if (reading.length) html += `<div class="hw-group">📖 읽는 중${label} ${reading.length}</div>` + reading.map(bookItemHtml).join('');
    if (done.length) html += `<div class="hw-group">✅ 다 읽은 책${label} ${done.length}</div>` + done.map(bookItemHtml).join('');
    $('bookList').innerHTML = html;
  }

  function bookCloudHtml() {
    const words = BOOKS.cloud || [];
    const title = TEACHER ? '☁️ 우리 반 독서 낱말 구름' : '☁️ 나의 독서 낱말 구름';
    if (words.length < 3) {
      return TEACHER ? '' : `<div class="cloud-card"><div class="cloud-head"><b>${title}</b></div>
        <div class="cloud-empty">한 줄 생각과 감상문을 쓸수록 내 낱말 구름이 자라요 🌱</div></div>`;
    }
    const max = words[0].n, min = words[words.length - 1].n;
    const size = n => max === min ? 24 : Math.round(15 + (Math.sqrt(n - min) / Math.sqrt(max - min)) * 27);
    const arranged = [];
    words.forEach((w, i) => (i % 2 ? arranged.push(w) : arranged.unshift(w)));
    const btns = arranged.map(w => {
      const color = CLOUD_COLORS[hashStr(w.w) % CLOUD_COLORS.length];
      const sel = bookSel === w.w;
      return `<button class="cw ${sel ? 'on' : ''} ${bookSel && !sel ? 'dim' : ''}" style="font-size:${size(w.n)}px;--cw:${color}"
        title="${w.n}번" onclick="pickBookWord('${esc(w.w).replace(/'/g, "\\'")}')">${esc(w.w)}</button>`;
    }).join('');
    return `
      <div class="cloud-card">
        <div class="cloud-head"><b>${title}</b><span>${bookSel ? `<button class="cloud-clear" onclick="pickBookWord(null)">전체 보기 ✕</button>` : '낱말을 눌러 보세요'}</span></div>
        <div class="cloud">${btns}</div>
        <div class="cloud-foot">${TEACHER ? '학생들의' : '내'} 책 제목, 한 줄 생각, 감상문에서 많이 쓴 낱말일수록 크게 보여요</div>
      </div>`;
  }

  function pickBookWord(w) {
    bookSel = bookSel === w ? null : w;
    renderBookList();
  }

  function bookItemHtml(b) {
    return `
      <button class="inq-item bk-item ${b.finished ? 'done' : ''}" onclick="openBook('${esc(b.id)}')">
        <span class="ic">${b.finished ? '📗' : '📙'}</span>
        <span class="tx">
          <div class="tt">${TEACHER ? `${b.num}번 ${esc(b.name)} · ` : ''}${esc(b.title)}</div>
          <div class="pv">${b.author ? esc(b.author) + ' · ' : ''}${b.maxEnd} / ${b.pages}쪽 (${b.pct}%)${b.lastThought ? ' · 💭 ' + esc(b.lastThought) : ''}</div>
          <div class="bk-bar"><i style="width:${b.pct}%"></i></div>
          <div class="meta">
            <span class="tag">📖 기록 ${b.logs}번</span>
            <span class="tag ${b.reviews ? 'subj' : ''}">✍️ 감상문 ${b.reviews ? b.reviews + '차' : '아직'}</span>
            ${b.rewarded ? '<span class="tag" style="background:#fff4d6;color:#b37400">🪙 완독 보상</span>' : ''}
            <span class="bk-time">${esc(b.updated)}</span>
          </div>
        </span>
      </button>`;
  }

  function openBook(id) {
    bookTab = 'log';
    showLoading(true);
    google.script.run
      .withSuccessHandler(res => {
        showLoading(false);
        if (!res.ok) { res.reason === 'auth' ? authExpired() : toast(res.message); return; }
        BOOKD = res;
        renderBook(true);
        showScreen('bookDetailScreen');
      })
      .withFailureHandler(onError)
      .getBook(TOKEN, id);
  }

  function reviewDirty() {
    const t = $('revText');
    return !!(t && t.value.trim() && t.value.trim() !== (t.dataset.orig || '').trim());
  }

  function closeBook() {
    if (reviewDirty() && !confirm('감상문이 저장되지 않았어요. 나갈까요?')) return;
    BOOKD = null;
    showScreen('bookScreen');
    loadBooks(false);
  }

  function setBookTab(tab) {
    bookTab = tab;
    const split = document.querySelector('.bk-split');
    if (split) split.dataset.tab = tab;
    $('segLog').classList.toggle('on', tab === 'log');
    $('segRev').classList.toggle('on', tab === 'rev');
  }

  /* fresh: 처음 열 때 true (감상문 칸을 최신 감상문으로 채워요). 저장 뒤에는 쓰던 내용을 지켜요. */
  function renderBook(fresh) {
    const D = BOOKD, b = D.book, R = D.rules;
    const draftRev = !fresh && $('revText') ? $('revText').value : null;
    const draftThought = !fresh && $('lgThought') ? $('lgThought').value : '';
    const lastRev = D.reviews[D.reviews.length - 1];

    $('bookTitle').textContent = (TEACHER ? `${b.num}번 ${b.name} · ` : '') + b.title;
    $('bookEditBtn').style.display = TEACHER ? 'none' : '';

    // 위: 진행 막대 + 완독 보상 조건
    const c = D.check;
    let head = `
      <div class="bk-prog ${b.finished ? 'done' : ''}">
        <div class="row1"><b>${b.maxEnd}</b><span>/ ${b.pages}쪽</span><em>${b.finished ? '다 읽었어요 🎉' : b.pct + '%'}</em></div>
        <div class="bk-bar"><i style="width:${b.pct}%"></i></div>
        <div class="au">${b.author ? '✍️ ' + esc(b.author) + ' · ' : ''}📅 ${D.days}일 동안 ${D.logs.length}번 기록</div>`;
    if (c.rewarded) {
      head += `<div class="bk-got">🪙 완독 보상 ${R.bookReward}야호를 받은 책이에요</div>`;
    } else {
      head += `
        <div class="bk-check">
          <div class="${c.reached ? 'ok' : ''}">끝 쪽까지<b>${c.reached ? '✓' : `${b.maxEnd}/${b.pages}쪽`}</b></div>
          <div class="${c.review ? 'ok' : ''}">감상문<b>${c.review ? '✓' : `${D.reviewLen}/${R.minReview}자`}</b></div>
          <div class="${c.days ? 'ok' : ''}">기록한 날<b>${c.days ? '✓' : `${D.days}/${R.minDays}일`}</b></div>
        </div>
        ${TEACHER ? '' : `<div class="bk-hint">세 가지를 모두 채우면 <b>${R.bookReward}야호</b>를 받아요</div>`}`;
    }
    head += `</div>`;
    $('bookHead').innerHTML = head;

    // 왼쪽: 읽은 기록
    let logCol = `<div class="bk-col-log"><div class="col-head2">📖 읽은 기록</div>`;
    if (!TEACHER) {
      logCol += c.rewarded ? '' : `
        <div class="panel">
          <div class="field-label" style="gap:8px">오늘 읽은 쪽 <span style="text-align:right">${D.readRewardedToday ? '오늘 독서 야호는 받았어요 ✓' : `${R.minPages}쪽 이상 + 한 줄 생각 → ${R.reward}야호`}</span></div>
          <div class="pg-row">
            <input class="bk-input" id="lgStart" type="number" inputmode="numeric" min="1" max="${b.pages}" value="${D.nextStart}" oninput="updateReadCount()">
            <span>쪽부터</span>
            <input class="bk-input" id="lgEnd" type="number" inputmode="numeric" min="1" max="${b.pages}" placeholder="?" oninput="updateReadCount()">
            <span>쪽까지</span>
          </div>
          <div class="bk-read" id="lgCount"></div>
          <div class="field-label" style="margin-top:10px">한 줄 생각 <span id="lgLen">0/${R.maxThought}</span></div>
          <input class="bk-input" id="lgThought" maxlength="${R.maxThought}" placeholder="예) 주인공이 용기를 내는 장면이 멋졌다" value="${esc(draftThought)}" oninput="updateReadCount()">
          <div class="btn-row" style="margin-top:12px"><button class="btn primary" id="lgSave" onclick="saveReadingLog()">📖 기록하기</button></div>
        </div>`;
    }
    logCol += `<div class="panel">`;
    logCol += D.logs.length ? D.logs.map(l => `
      <div class="log-item">
        <div class="hd">📄 ${l.start}~${l.end}쪽 <span>${l.pages}쪽 · ${esc(l.time)}</span>
          ${l.yaho ? `<em class="got">🪙 +${l.yaho}</em>` : (TEACHER && l.note ? `<em>${esc(l.note)}</em>` : '')}</div>
        ${l.thought ? `<p>💭 ${esc(l.thought)}</p>` : '<p class="none">한 줄 생각 없음</p>'}
      </div>`).join('') : `<div class="locked"><i>📄</i>${TEACHER ? '아직 기록이 없어요' : '첫 기록을 남겨 볼까요?'}</div>`;
    logCol += `</div></div>`;

    // 오른쪽: 감상문
    let revCol = `<div class="bk-col-rev"><div class="col-head2">✍️ 감상문</div>`;
    if (!TEACHER) {
      const val = draftRev !== null ? draftRev : (lastRev ? lastRev.text : '');
      revCol += `
        <div class="panel">
          <div class="field-label">${lastRev ? `감상문 고쳐 쓰기 <span>지금 ${lastRev.nth}차</span>` : '감상문 쓰기 <span>계속 고쳐 쓸 수 있어요</span>'}</div>
          <textarea class="sum-text" id="revText" maxlength="${R.maxReview}" data-orig="${esc(lastRev ? lastRev.text : '')}" oninput="updateRevCount()"
            placeholder="예) 이 책에서 가장 기억에 남는 장면은 ... 왜냐하면 ... 내가 주인공이라면 ...">${esc(val)}</textarea>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
            <span class="rev-count" id="revCount"></span>
            <span class="rev-count">${c.rewarded ? '' : `${R.minReview}자 이상이면 완독 조건 ✓`}</span>
          </div>
          <div class="btn-row" style="margin-top:12px"><button class="btn primary" id="revSave" onclick="saveReview()">✍️ 감상문 저장</button></div>
        </div>`;
    }
    revCol += `<div class="panel">`;
    revCol += D.reviews.length ? D.reviews.slice().reverse().map((r, i) => `
      <div class="sum-hist">
        <div class="hd">${r.nth}차 ${i === 0 ? '(최신)' : ''}<span>${esc(r.time)} · ${r.len}자</span>${r.yaho ? `<em class="got">🪙 +${r.yaho}</em>` : ''}</div>
        <p>${esc(r.text)}</p>
      </div>`).join('') : `<div class="locked"><i>✍️</i>${TEACHER ? '아직 감상문이 없어요' : '책을 읽으며 느낀 점을 써 봐요'}</div>`;
    revCol += `</div></div>`;

    $('bookBody').innerHTML = `<div class="bk-split" data-tab="${bookTab}">${logCol}${revCol}</div>`;
    setBookTab(bookTab);
    updateReadCount();
    updateRevCount();
  }

  function updateReadCount() {
    const box = $('lgCount');
    if (!box || !BOOKD) return;
    const R = BOOKD.rules;
    const s = parseInt($('lgStart').value, 10), e = parseInt($('lgEnd').value, 10);
    const th = $('lgThought').value.trim();
    $('lgLen').textContent = `${$('lgThought').value.length}/${R.maxThought}`;
    if (!s || !e) { box.textContent = '끝 쪽을 쓰면 몇 쪽 읽었는지 알려 줄게요'; box.className = 'bk-read'; return; }
    if (e < s) { box.textContent = '끝 쪽이 시작 쪽보다 앞이에요'; box.className = 'bk-read'; return; }
    if (e > BOOKD.book.pages) { box.textContent = `이 책은 ${BOOKD.book.pages}쪽까지 있어요`; box.className = 'bk-read'; return; }
    const n = e - s + 1;
    const enough = n >= R.minPages;
    let msg = `📄 ${n}쪽 읽었어요`;
    if (e >= BOOKD.book.pages) msg += ' · 마지막 쪽까지! 🎉';
    if (!BOOKD.readRewardedToday) {
      if (!enough) msg += ` · ${R.minPages - n}쪽 더 읽으면 야호`;
      else if (!th) msg += ' · 한 줄 생각을 쓰면 야호';
      else msg += ` · 🪙 +${R.reward}야호`;
    }
    box.textContent = msg;
    box.className = 'bk-read' + (enough && th ? ' ok' : '');
  }

  function updateRevCount() {
    const t = $('revText');
    if (!t || !BOOKD) return;
    const n = t.value.trim().length, need = BOOKD.rules.minReview;
    const el = $('revCount');
    el.textContent = `${n}자` + (n < need ? ` (${need - n}자 더)` : ' ✓');
    el.classList.toggle('ok', n >= need);
  }

  function afterBookSave(res) {
    BOOKD = res;
    renderBook(false);
    const s = res.saved || {};
    if (s.bonus) { toast(`🎉 책을 다 읽었어요! 완독 보상 +${res.rules.bookReward}야호`); }
    else if (s.kind === 'log') toast(s.yaho ? `📖 기록했어요! +${s.yaho}야호` : `📖 기록했어요${s.reason === '오늘 이미 받음' ? ' (오늘 야호는 이미 받았어요)' : ''}`);
    else if (s.kind === 'review') toast(`✍️ 감상문 ${s.nth}차를 저장했어요`);
    if (s.yaho || s.bonus) { BOOKS = null; fetchDashboard(false); }
  }

  function saveReadingLog() {
    if (bookBusy) return;
    const s = $('lgStart').value, e = $('lgEnd').value, th = $('lgThought').value;
    if (!s || !e) { toast('몇 쪽부터 몇 쪽까지 읽었는지 써 주세요'); return; }
    bookBusy = true;
    $('lgSave').disabled = true;
    showLoading(true);
    google.script.run
      .withSuccessHandler(res => {
        bookBusy = false;
        showLoading(false);
        if (!res.ok) {
          if ($('lgSave')) $('lgSave').disabled = false;
          res.reason === 'auth' ? authExpired() : toast(res.message);
          return;
        }
        $('lgThought').value = '';
        afterBookSave(res);
      })
      .withFailureHandler(err => { bookBusy = false; if ($('lgSave')) $('lgSave').disabled = false; onError(err); })
      .addReadingLog(TOKEN, BOOKD.book.id, s, e, th);
  }

  function saveReview() {
    if (bookBusy) return;
    const text = $('revText').value.trim();
    if (!text) { toast('감상문을 써 주세요'); return; }
    if (text === ($('revText').dataset.orig || '').trim()) { toast('고친 내용이 있을 때 저장해요'); return; }
    bookBusy = true;
    $('revSave').disabled = true;
    showLoading(true);
    google.script.run
      .withSuccessHandler(res => {
        bookBusy = false;
        showLoading(false);
        if (!res.ok) {
          if ($('revSave')) $('revSave').disabled = false;
          res.reason === 'auth' ? authExpired() : toast(res.message);
          return;
        }
        $('revText').value = text;
        $('revText').dataset.orig = text;
        afterBookSave(res);
      })
      .withFailureHandler(err => { bookBusy = false; if ($('revSave')) $('revSave').disabled = false; onError(err); })
      .saveBookReview(TOKEN, BOOKD.book.id, text);
  }

  /* 책 등록 / 고치기 */
  function openBookForm(edit) {
    bookEditing = !!edit && !!BOOKD;
    const b = bookEditing ? BOOKD.book : null;
    $('bfTitle').textContent = b ? '✏️ 책 정보 고치기' : '📘 새 책 등록';
    $('bfHint').textContent = b ? '제목, 지은이, 전체 쪽수를 고칠 수 있어요' : '읽고 있는 책을 알려 줘요';
    $('bfHint').classList.remove('err');
    $('bfName').value = b ? b.title : '';
    $('bfAuthor').value = b ? b.author : '';
    $('bfPages').value = b ? b.pages : '';
    $('bfSave').textContent = b ? '저장하기' : '등록하기';
    $('bfSave').disabled = false;
    $('bookForm').classList.add('show');
    setTimeout(() => $('bfName').focus(), 80);
  }

  function closeBookForm() { $('bookForm').classList.remove('show'); }

  function saveBookForm() {
    const title = $('bfName').value.trim(), author = $('bfAuthor').value.trim(), pages = $('bfPages').value;
    const err = m => { $('bfHint').textContent = m; $('bfHint').classList.add('err'); };
    if (!title) return err('책 제목을 써 주세요');
    if (!(Number(pages) >= 1)) return err('전체 쪽수를 숫자로 써 주세요');
    $('bfSave').disabled = true;
    showLoading(true);
    const done = res => {
      showLoading(false);
      $('bfSave').disabled = false;
      if (!res.ok) { if (res.reason === 'auth') { closeBookForm(); authExpired(); } else err(res.message); return; }
      closeBookForm();
      BOOKS = null;
      bookTab = 'log';
      if (bookEditing) { afterBookSave(res); if (!(res.saved && res.saved.bonus)) toast('책 정보를 고쳤어요'); }
      else { BOOKD = res; renderBook(true); showScreen('bookDetailScreen'); toast('📘 책을 등록했어요! 읽은 쪽을 기록해 봐요'); }
    };
    const fail = e => { showLoading(false); $('bfSave').disabled = false; onError(e); };
    if (bookEditing) google.script.run.withSuccessHandler(done).withFailureHandler(fail).editBook(TOKEN, BOOKD.book.id, title, author, pages);
    else google.script.run.withSuccessHandler(done).withFailureHandler(fail).addBook(TOKEN, title, author, pages);
  }

  /* ---------- 공통 ---------- */
  function showLoading(on) { $('loading').classList.toggle('show', on); }

  let toastTimer = null;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  function onError(err) {
    showLoading(false);
    toast('⚠️ ' + (err && err.message ? err.message : '오류가 발생했어요.'));
  }
</script>
</body>
</html>
